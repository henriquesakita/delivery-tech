name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Rodar os testes
        run: ./mvnw -B test

      - name: Empacotar o JAR
        run: ./mvnw -B package -DskipTests

      - name: Guardar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            delivery-api/target/surefire-reports/
            delivery-api/target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: Build e smoke test da imagem
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t delivery-api:ci ./delivery-api

      - name: Subir o container
        run: docker run -d --name delivery-api-ci -p 8080:8080 delivery-api:ci

      - name: Esperar a aplicação responder
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Aplicação no ar."
              exit 0
            fi
            sleep 2
          done
          echo "A aplicação não subiu a tempo."
          exit 1

      - name: Testar o health check
        run: curl -fsS http://localhost:8080/actuator/health

      - name: Mostrar logs do container
        if: always()
        run: docker logs delivery-api-ci

      - name: Remover o container
        if: always()
        run: docker rm -f delivery-api-ci || true
